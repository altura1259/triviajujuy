<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title></title>
<style>
  :root{
    --bg1:#1b1033;
    --bg2:#3a0ca3;
    --card:#ffffff;
    --ink:#20143a;
    --muted:#6b6280;
    --accent:#ffd60a;
    --good:#2ecc71;
    --bad:#ff4d6d;
    --radius:22px;
    --shadow: 0 14px 30px rgba(0,0,0,.25);
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family: 'Segoe UI', Verdana, Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 15% 10%, #5a189a 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, #ff9f1c 0%, transparent 40%),
                linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #7209b7 100%);
    background-attachment: fixed;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .wrap{
    flex:1;
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding: 18px 16px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .topbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    margin-bottom: 10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    letter-spacing:.3px;
    text-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .brand-logo-badge{
    background:transparent;
    border-radius:0;
    padding:0;
    display:flex;
    align-items:center;
    box-shadow:none;
    flex-shrink:0;
  }
  .brand-logo-badge img{
    height:38px;
    width:auto;
    display:block;
  }
  .brand small{display:block;font-weight:500;opacity:.85;font-size:.72rem;}
  .top-actions{display:flex;gap:8px;}
  .icon-btn{
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.25);
    color:#fff;
    width:40px;height:40px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:1.05rem;
    transition: transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,.26); transform: translateY(-2px); }

  h1.title{
    color:#fff;
    text-align:center;
    font-size: clamp(1.4rem, 3.2vw, 2.4rem);
    margin: 6px 0 2px;
    text-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  p.subtitle{
    color: #f1e9ff;
    text-align:center;
    margin: 0 0 22px;
    font-size: clamp(.9rem, 1.6vw, 1.1rem);
    opacity:.9;
  }

  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width:100%;
    padding: 22px;
  }

  /* ---------- HOME GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    width:100%;
  }
  @media (max-width: 820px){ .grid{ grid-template-columns: repeat(3,1fr);} }
  @media (max-width: 520px){ .grid{ grid-template-columns: repeat(2,1fr);} }

  .cat-btn{
    border:none;
    border-radius: 18px;
    padding: 20px 10px 16px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color:#fff;
    font-weight:800;
    font-size: .95rem;
    text-align:center;
    box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 14px 24px rgba(0,0,0,.18);
    transform: translateY(0);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    min-height: 128px;
    position:relative;
    overflow:hidden;
  }
  .cat-btn::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%);
    pointer-events:none;
  }
  .cat-btn:hover{ transform: translateY(-4px); filter:brightness(1.05); }
  .cat-btn:active{ transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .cat-btn .emoji{ font-size: 2.2rem; line-height:1; filter: drop-shadow(0 3px 3px rgba(0,0,0,.25)); }
  .cat-btn.empty{ opacity:.55; cursor:not-allowed; filter:grayscale(.25); }
  .cat-btn .badge-count{
    position:absolute; top:8px; right:8px;
    background: rgba(0,0,0,.25);
    border-radius: 999px;
    font-size:.65rem;
    padding: 2px 7px;
    font-weight:700;
  }

  /* ---------- GAME ---------- */
  .game-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 14px; gap:10px; flex-wrap:wrap;
  }
  .game-cat-pill{
    display:flex; align-items:center; gap:8px;
    background: var(--pillbg, #eee);
    color:#fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-weight:800;
    font-size:.9rem;
  }
  .progress-track{
    flex:1;
    min-width: 140px;
    height: 10px;
    background: #ece7f6;
    border-radius: 999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg,#7209b7,#ff4d6d);
    border-radius:999px;
    transition: width .35s ease;
  }
  .score-pill{
    background:#f1e9ff; color:#4b1a8f; font-weight:800;
    padding:8px 14px; border-radius:999px; font-size:.9rem;
  }
  .timer-track{
    width:100%; height:8px; background:#f0eefc; border-radius:999px; overflow:hidden; margin-bottom:18px;
  }
  .timer-fill{ height:100%; background: linear-gradient(90deg,#ffd60a,#ff4d6d); width:100%; }

  .question-text{
    font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    font-weight: 800;
    color: var(--ink);
    margin: 4px 0 20px;
    line-height:1.35;
  }
  .options{
    display:flex; flex-direction:column; gap:12px;
  }
  .option-btn{
    text-align:left;
    border: 2px solid #e7e1f7;
    background:#faf9ff;
    border-radius:16px;
    padding: 16px 18px;
    font-size: 1.02rem;
    font-weight:700;
    color: var(--ink);
    cursor:pointer;
    display:flex; align-items:center; gap:12px;
    transition: transform .1s ease, border-color .15s ease, background .15s ease;
  }
  .option-btn .letter{
    width:32px; height:32px; border-radius:10px;
    background:#ece5fb; color:#5a189a; font-weight:900;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .option-btn:hover:not(:disabled){ border-color:#c7b8f0; transform: translateX(3px); }
  .option-btn:disabled{ cursor:default; }
  .option-btn.correct{ background: #e7fbef; border-color: var(--good); }
  .option-btn.correct .letter{ background: var(--good); color:#fff; }
  .option-btn.wrong{ background: #ffecef; border-color: var(--bad); }
  .option-btn.wrong .letter{ background: var(--bad); color:#fff; }

  .feedback-line{
    margin-top:16px; font-weight:800; font-size:1rem; min-height:1.4em;
  }
  .feedback-line.ok{ color: var(--good); }
  .feedback-line.no{ color: var(--bad); }

  /* ---------- RESULT ---------- */
  .result-wrap{ text-align:center; padding: 10px 6px; }
  .result-emoji{ font-size: 4rem; margin-bottom:6px; }
  .result-title{ font-size: clamp(1.4rem,3vw,2.2rem); font-weight:900; margin:6px 0; }
  .result-title.win{ color:#2ecc71; }
  .result-title.lose{ color:#7b2cbf; }
  .result-score{ font-size:1.2rem; font-weight:800; color:var(--muted); margin-bottom:14px; }
  .prize-box{
    background: linear-gradient(135deg,#fff6d6,#ffe7b3);
    border: 2px dashed #ffb703;
    border-radius:16px;
    padding: 16px 18px;
    color:#7a4a00;
    font-weight:700;
    margin: 14px auto 20px;
    max-width:520px;
  }
  .lose-box{
    background:#f4f0ff; border-radius:16px; padding:14px 18px;
    color:#4b1a8f; font-weight:600; margin: 10px auto 20px; max-width:520px;
  }
  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .btn{
    border:none; border-radius:14px; padding: 13px 22px; font-weight:800;
    cursor:pointer; font-size:.98rem; box-shadow: 0 6px 0 rgba(0,0,0,.15);
    transition: transform .1s ease;
  }
  .btn:active{ transform: translateY(3px); box-shadow:none; }
  .btn-primary{ background:#7209b7; color:#fff; }
  .btn-secondary{ background:#ece5fb; color:#4b1a8f; }
  .btn-ghost{ background:transparent; color:var(--muted); box-shadow:none; text-decoration:underline; }

  .idle-note{ text-align:center; color:var(--muted); font-size:.78rem; margin-top:18px; }

  /* ---------- ADMIN ---------- */
  .admin-login{ max-width:380px; margin: 40px auto; text-align:center; }
  .pin-input{
    width:100%; font-size:1.6rem; letter-spacing:.5em; text-align:center;
    padding: 14px; border-radius:14px; border:2px solid #e7e1f7; margin: 16px 0;
  }
  .field-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field-row label{ font-size:.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .field-row input[type=text], .field-row textarea, .field-row input[type=number]{
    border:2px solid #e7e1f7; border-radius:12px; padding:10px 12px; font-size:.95rem; font-family:inherit;
  }
  .admin-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
  .admin-header h2{ margin:0; font-size:1.3rem; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tab-btn{
    border:2px solid #e7e1f7; background:#fff; border-radius:999px;
    padding:8px 14px; font-weight:700; font-size:.82rem; cursor:pointer; color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .tab-btn.active{ background:#7209b7; border-color:#7209b7; color:#fff; }
  .tab-btn .warn-dot{ width:8px;height:8px;border-radius:50%; background:#ffb703; }

  .cat-edit-grid{ display:grid; grid-template-columns: 90px 1fr 110px 90px; gap:10px; align-items:center; margin-bottom:8px; }
  @media (max-width:640px){ .cat-edit-grid{ grid-template-columns: 1fr 1fr; } }

  .q-card{
    border:2px solid #f0ecfa; border-radius:16px; padding:14px; margin-bottom:12px; background:#fcfbff;
  }
  .q-card .opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .q-card .opt-row input[type=text]{ flex:1; }
  .q-card .opt-row input[type=radio]{ width:20px; height:20px; accent-color:#2ecc71; }
  .q-card-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .small-del{ background:#ffecef; color:#c0193c; border:none; border-radius:8px; padding:6px 10px; font-weight:700; cursor:pointer; font-size:.78rem; }
  .add-q-btn{ background:#eafbf1; color:#1f9d55; border:2px dashed #2ecc71; border-radius:14px; padding:12px; width:100%; font-weight:800; cursor:pointer; }
  .save-hint{ font-size:.75rem; color:#1f9d55; font-weight:700; }
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .toolbar .btn{ box-shadow:none; padding:10px 16px; font-size:.85rem; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.85rem; color:var(--ink); }
  hr.sep{ border:none; border-top:2px solid #f0ecfa; margin:20px 0; }

  .stats-card{
    background: linear-gradient(160deg,#f6f2ff,#fbfaff);
    border:2px solid #e7dcff;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
  }
  .stats-card-top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .stat-tiles{ display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
  @media (max-width:640px){ .stat-tiles{ grid-template-columns: repeat(2, 1fr); } }
  .stat-tile{ background:#fff; border-radius:14px; padding:14px 10px; text-align:center; box-shadow:0 4px 10px rgba(90,24,154,.08); }
  .stat-num{ font-size:1.6rem; font-weight:900; color:#5a189a; line-height:1.1; }
  .stat-label{ font-size:.72rem; font-weight:700; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.3px; }
  .stat-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .stat-bar-label{ width:150px; flex-shrink:0; font-size:.82rem; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-bar-track{ flex:1; height:14px; background:#ece5fb; border-radius:999px; overflow:hidden; }
  .stat-bar-fill{ height:100%; background:linear-gradient(90deg,#7209b7,#c77dff); border-radius:999px; }
  .stat-bar-count{ width:26px; text-align:right; font-size:.8rem; font-weight:800; color:#5a189a; }
  .hidden{ display:none !important; }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:#20143a; color:#fff; padding:12px 20px; border-radius:999px;
    font-weight:700; font-size:.85rem; box-shadow:0 10px 25px rgba(0,0,0,.3);
    z-index:999; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .confetti-piece{
    position:fixed; top:-20px; width:10px; height:16px; z-index:998; pointer-events:none;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(540deg); opacity:.9; }
  }


  /* ---- Bloque QR Instagram (mismo estilo que los botones de temática) ---- */
  .qr-card{
    position:relative; overflow:hidden;
    margin-top:24px; display:flex; align-items:center; justify-content:center; gap:22px;
    background:linear-gradient(160deg,#3a0ca3,#7209b7); color:#fff;
    border-radius:18px; padding:20px 24px;
    box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 14px 24px rgba(0,0,0,.18);
  }
  .qr-card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,0) 55%);
  }
  .qr-card > *{ position:relative; z-index:1; }
  .qr-box{ background:#fff; border-radius:14px; padding:10px; flex-shrink:0; line-height:0; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .qr-box img, .qr-box .qr-svg{ width:140px; height:140px; display:block; }
  .qr-text h2{ margin:0 0 6px; font-size:1.7rem; font-weight:800; color:var(--accent); text-shadow:0 2px 8px rgba(0,0,0,.35); }
  .qr-text p{ margin:0 0 6px; font-size:.95rem; line-height:1.35; font-weight:600; }
  .qr-text .qr-handle{ font-weight:800; margin:0; }
  @media (max-width:560px){
    .qr-card{ flex-direction:column; text-align:center; gap:14px; }
    .qr-box img, .qr-box .qr-svg{ width:160px; height:160px; }
  }

  footer.foot{ text-align:center; color:#e6dbff; opacity:.7; font-size:.72rem; margin-top:26px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="brand-logo-badge"><img src="https://globalsellers.com.ar/wp-content/uploads/2026/10/log-jujuy.png" alt="Gobierno de Jujuy - Ministerio de Desarrollo Económico y Producción"></span>
      <div>
        <small></small>
        <small></small>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" title="Pantalla completa" onclick="toggleFullscreen()">⛶</button>
      <button class="icon-btn" id="gearBtn" title="Panel administrador" onclick="openAdminEntry()">⚙️</button>
    </div>
  </div>

  <h1 class="title" id="mainTitle">¡Jugá y demostrá lo que sabés!</h1>
  <p class="subtitle" id="mainSubtitle">Elegí una temática, respondé 5 preguntas y ganá tu premio en el stand 🎁</p>

  <div class="card" id="app"></div>

  <footer class="foot">App by Comunicación y Prensa | Ministerio de Desarrollo Económico y Producción · Gobierno de Jujuy ·</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATOS
   ============================================================ */
const STORAGE_KEY = 'jujuy_trivia_data_v1';

const CONTENT_VERSION = 2;
/* Segundos por pregunta: FIJO para todas las PCs (ignora lo guardado en el navegador y en el JSON). Cambiá este número si querés otro valor. */
const FIXED_TIMER_SECONDS = 45;

/* Nombre del JSON publicado junto al HTML (mismo nombre que baja el botón
   "Exportar preguntas"). Se busca en la misma carpeta, así que funciona sin
   cambios tanto en GitHub Pages como en cualquier otro hosting. Al abrir el
   HTML como archivo local (file://) el navegador bloquea este fetch por
   seguridad, así que ahí el juego sigue funcionando solo con lo guardado en
   el dispositivo (localStorage), como hasta ahora. */
const REMOTE_DATA_URL = 'trivia-ministerio-jujuy-datos.json';

const DEFAULT_DATA = {
  version: 1,
  contentVersion: CONTENT_VERSION,
  pin: "1234",
  prizeMessage: "¡Mostrá esta pantalla en el stand del Ministerio de Desarrollo Económico y Producción para retirar tu premio sorpresa! 🎁",
  winThreshold: 3,
  timerEnabled: true,
  timerSeconds: 20,
  plays: [],
  categories: [
    cat('agencia-comercializacion', 'Agencia de Comercialización', '🛒', '#FF9F1C', [
      q('¿Qué es la comercialización de un producto?', ['El proceso de llevarlo del productor al consumidor', 'Solo fabricarlo', 'Solo diseñarlo'], 0),
      q('¿Cuál de estos es un canal de comercialización?', ['Una feria o mercado', 'Un río', 'Una montaña'], 0),
      q('¿Para qué sirve una marca en la comercialización?', ['Para que el consumidor identifique y confíe en el producto', 'Para subir la temperatura', 'Para nada en particular'], 0),
      q('¿Qué ventaja tiene vender en ferias como esta Expo?', ['Contacto directo con el comprador', 'Ninguna ventaja', 'Solo genera pérdidas'], 0),
      q("¿Qué es el 'packaging' de un producto?", ['El envase y presentación del producto', 'El transporte aéreo', 'Un tipo de impuesto'], 0),
    ]),
    cat('vitivinicultura', 'Vitivinicultura', '🍷', '#7B2CBF', [
      q('¿Qué se produce principalmente en una bodega?', ['Vino', 'Cerámica', 'Software'], 0),
      q('¿Cómo se llama la actividad de cultivar vid para producir vino?', ['Viticultura', 'Apicultura', 'Avicultura'], 0),
      q("¿Qué caracteriza a los llamados 'vinos de altura'?", ['Se cultivan a gran altitud sobre el nivel del mar', 'Se guardan en edificios altos', 'No llevan uvas'], 0),
      q('¿Qué es la vendimia?', ['La cosecha de la uva', 'La poda de invierno', 'El etiquetado de la botella'], 0),
      q('¿Qué factor climático favorece la vitivinicultura de altura en el norte argentino?', ['La amplitud térmica entre el día y la noche', 'La humedad constante', 'La cercanía al mar'], 0),
    ]),
    cat('parques-industriales', 'Parques Industriales', '🏭', '#EF476F', [
      q('¿Qué es un parque industrial?', ['Un predio organizado con infraestructura para instalar industrias', 'Un espacio verde recreativo', 'Un depósito de basura'], 0),
      q('¿Qué es una PyME?', ['Pequeña y Mediana Empresa', 'Un tipo de impuesto', 'Una marca registrada'], 0),
      q('¿Cuál de estos es un ejemplo de industria manufacturera?', ['Textiles y tejidos', 'El clima de la Puna', 'Un cerro'], 0),
      q('¿Qué organismo suele apoyar a las industrias locales con financiamiento y capacitación?', ['El Ministerio de Desarrollo Económico y Producción', 'Un club de fútbol', 'Una agencia de viajes'], 0),
      q("¿Qué significa 'valor agregado' en un producto industrial?", ['Sumarle procesos que aumentan su utilidad y precio', 'Bajarle el precio final', 'Quitarle el envase'], 0),
    ]),
    cat('servicios-conocimiento', 'Servicios Basados en el Conocimiento', '💡', '#06D6A0', [
      q('¿Qué se busca fortalecer con políticas de innovación y conocimiento?', ['Nuevas capacidades técnicas y tecnológicas', 'Solo el turismo', 'Nada en particular'], 0),
      q('¿Qué es la capacitación laboral?', ['Formación para mejorar habilidades de trabajo', 'Un tipo de multa', 'Un día feriado'], 0),
      q('¿Qué rol cumplen las universidades en el desarrollo productivo?', ['Generan conocimiento e investigación aplicada', 'Ninguno', 'Solo entregan diplomas'], 0),
      q('¿Qué es un polo o parque tecnológico?', ['Un espacio que reúne empresas e instituciones de innovación', 'Un tipo de helado', 'Una plaza pública'], 0),
      q('¿Por qué es importante la transferencia de conocimiento a las empresas?', ['Porque mejora su competitividad', 'Porque es solo un trámite', 'No es importante'], 0),
    ]),
    cat('zona-franca', 'Zona Franca', '🌐', '#118AB2', []),
    cat('jemse', 'Jemse', '⚙️', '#E76F51', []),
    cat('desarrollo-productivo', 'Secretaría de Desarrollo Productivo', '📈', '#2EC4B6', []),
    cat('ley-inversiones', 'Ley de Inversiones', '📜', '#8338EC', []),
    cat('fogajuy', 'FOGAJUY', '💰', '#FFB703', []),
    cat('consejo-microempresa', 'Consejo de la Microempresa', '🛍️', '#FB5607', [

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.categories)){
        // Migración de contenido: si el dispositivo tiene datos guardados de una
        // versión anterior (sin las temáticas nuevas), se actualiza el listado de
        // temáticas/preguntas de ejemplo pero se conservan el PIN, la config y las
        // estadísticas ya guardadas en este dispositivo.
        if(!parsed.contentVersion || parsed.contentVersion < CONTENT_VERSION){
          parsed.categories = JSON.parse(JSON.stringify(DEFAULT_DATA.categories));
          parsed.contentVersion = CONTENT_VERSION;
          saveData(parsed);
        }
        // Compatibilidad: preguntas viejas guardadas con "correct" como número
        // suelto en vez de un array de índices.
        parsed.categories.forEach(c=>{
          (c.questions||[]).forEach(qq=>{
            if(!Array.isArray(qq.correct)) qq.correct = [qq.correct];
          });
        });
        return parsed;
      }
    }
  }catch(e){ console.warn('No se pudo leer localStorage, uso datos por defecto.', e); }
  const fresh = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData(fresh);
  return fresh;
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); return true; }
  catch(e){ console.warn('No se pudo guardar en localStorage.', e); return false; }
}
let saveFailWarned = false;
function persist(){
  data.lastSavedAt = Date.now();
  const ok = saveData(data);
  if(!ok && !saveFailWarned){
    saveFailWarned = true;
    toast('⚠️ No se pudo guardar este cambio en el dispositivo (memoria llena o navegación privada)');
  }
  if(ok) saveFailWarned = false;
  return ok;
}

  const ok = persist();

  toast(ok ? '✅ Cambios guardados en este dispositivo' : '⚠️ No se pudo guardar. Probá exportar el JSON como respaldo.');

/* Auto-test de almacenamiento: escribe y lee un valor de prueba para detectar
   si el navegador está bloqueando/limitando localStorage (ej: navegación
   privada). Esto NO garantiza que los datos sobrevivan a cerrar el navegador
   (en modo privado el navegador borra todo al cerrar aunque el guardado en sí
   funcione sin error), pero detecta el caso más común de fallo inmediato. */
function testStorageWritable(){
  try{
    const testKey = STORAGE_KEY + '__test__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);
    return ok;
  }catch(e){ return false; }
}

/* ============================================================
   SINCRONIZACIÓN CON EL JSON PUBLICADO (GitHub Pages u otro hosting)
   ============================================================
   Trae trivia-ministerio-jujuy-datos.json de la misma carpeta que el HTML.
   Si el archivo no existe, no hay internet, o el HTML se abrió como archivo
   local (file://, donde el navegador bloquea este fetch), se sigue
   funcionando con lo que ya había en este dispositivo, sin romper nada. */
let remoteSyncStatus = 'idle'; // idle | ok | error
async function fetchRemoteData(){
  try{
    const res = await fetch(REMOTE_DATA_URL + '?v=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json();
    if(!remote || !Array.isArray(remote.categories)) throw new Error('Formato inválido');
    return remote;
  }catch(e){
    console.warn('No se pudo traer el JSON publicado, se sigue usando lo local.', e);
    return null;
  }
}
function normalizeRemoteCategories(remote){
  remote.categories.forEach(c=>{
    (c.questions || []).forEach(qq=>{
      if(!Array.isArray(qq.correct)) qq.correct = [qq.correct];
    });
  });
}
function applyRemoteData(remote){
  normalizeRemoteCategories(remote);
  // Se toma el contenido (temáticas/preguntas) y la configuración del juego
  // del JSON publicado. Las estadísticas (plays) quedan como estaban en
  // este dispositivo: son propias de cada pantalla, no se sincronizan.
  data.categories = remote.categories;
  if(typeof remote.pin === 'string') data.pin = remote.pin;
  if(typeof remote.prizeMessage === 'string') data.prizeMessage = remote.prizeMessage;
  if(typeof remote.winThreshold === 'number') data.winThreshold = remote.winThreshold;
  if(typeof remote.timerEnabled === 'boolean') data.timerEnabled = remote.timerEnabled;
  if(typeof remote.timerSeconds === 'number') data.timerSeconds = remote.timerSeconds;
  data.contentVersion = CONTENT_VERSION;
  data.remoteSyncedAt = Date.now();
  persist();
}
async function initRemoteSync(){
  const remote = await fetchRemoteData();
  if(remote){
    applyRemoteData(remote);
    remoteSyncStatus = 'ok';
    if(state.screen === 'home') render();
  } else {
    remoteSyncStatus = 'error';
  }
}
async function manualSync(){
  toast('🔄 Buscando la última versión publicada en GitHub...');

  if(remote){
    applyRemoteData(remote);
    remoteSyncStatus = 'ok';
    if(!data.categories.some(c=>c.id===adminActiveTab)){

}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function contrastText(hex){
  hex = (hex||'#888888').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? '#20143a' : '#ffffff';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ---------- JUEGO ---------- */
/* "Bolsa" de preguntas sin repetición: reparte las preguntas de una temática
   sin repetir ninguna hasta que se usaron todas; recién ahí vuelve a barajar.
   Así, si cargás 10 preguntas y se juegan de a 5, el próximo juego trae
   las otras 5 antes de repetir alguna. Vive en memoria (no en localStorage):
   se reinicia si se recarga la página, lo cual es intencional para que
   cada apertura del juego empiece con un mazo fresco. */
const questionBags = {};

function pickQuestionsForCategory(category, n){
  const catId = category.id;
  let bag = questionBags[catId] ? questionBags[catId].bag : [];
  const lastServed = questionBags[catId] ? questionBags[catId].last : null;
  const picked = [];

  while(picked.length < n){
    if(bag.length === 0){
      bag = shuffle(category.questions);
      // evita que la primera pregunta del mazo nuevo sea la misma que cerró el mazo anterior
      if(lastServed && bag.length > 1 && bag[bag.length - 1] === lastServed){
        const swapIdx = Math.floor(Math.random() * (bag.length - 1));
        const tmp = bag[bag.length - 1];
        bag[bag.length - 1] = bag[swapIdx];
        bag[swapIdx] = tmp;
      }
    }
    picked.push(bag.pop());
  }

  questionBags[catId] = { bag, last: picked[picked.length - 1] };
  return picked;
}

function startGame(category){
  const n = Math.min(5, category.questions.length);
  state.category = category;
  state.questions = pickQuestionsForCategory(category, n).map(orig=>{
    const correctList = Array.isArray(orig.correct) ? orig.correct : [orig.correct];
    const multi = correctList.length >= 2;
    // Si el admin marcó 2 o más respuestas correctas, ninguna opción A/B/C
    // individual cuenta como correcta: se agrega una 4ª opción "Todas son
    // correctas" y esa pasa a ser la única respuesta válida.
    const order = shuffle(orig.options.map((text, i)=>({text, isCorrect: !multi && correctList.includes(i)})));
    if(multi){
      order.push({ text: 'Todas son correctas (A, B, C o todas las anteriores)', isCorrect: true });
    }
    return { q: orig.q, options: order };
  });
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.screen = 'game';
  render();
}

function renderGame(){
  const c = state.category;
  const total = state.questions.length;
  const current = state.questions[state.index];
  const pct = Math.round((state.index)/total*100);
  const letters = ['A','B','C','D'].slice(0, current.options.length);
  const optsHtml = current.options.map((opt,i)=>`
    <button class="option-btn" id="opt-${i}" onclick="selectOption(${i})">
      <span class="letter">${letters[i]}</span>
      <span>${escapeHtml(opt.text)}</span>
    </button>`).join('');

  return `
    <div class="game-head">
      <span class="game-cat-pill" style="background:${c.color};">${c.icon} ${escapeHtml(c.name)}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="score-pill">✅ ${state.score}/${total}</span>
    </div>
    ${data.timerEnabled ? `<div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>` : ''}
    <div style="font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:6px;">Pregunta ${state.index+1} de ${total}</div>
    <div class="question-text">${escapeHtml(current.q)}</div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-line" id="feedbackLine"></div>
  `;
}

function startQuestionTimer(){
  clearInterval(state.timer);
  if(!data.timerEnabled) return;
  state.timeLeft = FIXED_TIMER_SECONDS;
  const fill = document.getElementById('timerFill');
  if(!fill) return;
  fill.style.transition = `width ${state.timeLeft}s linear`;
  requestAnimationFrame(()=>{ fill.style.width = '0%'; });
  state.timer = setTimeout(()=>{
    if(!state.answered) selectOption(-1);
  }, state.timeLeft*1000);
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  clearTimeout(state.timer);
  const current = state.questions[state.index];
  const correctIndex = current.options.findIndex(o=>o.isCorrect);
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b=> b.disabled = true);
  if(correctIndex >= 0) buttons[correctIndex].classList.add('correct');
  const fb = document.getElementById('feedbackLine');

  if(i === correctIndex){
    state.score++;
    fb.textContent = '¡Correcto! 🎉';
    fb.className = 'feedback-line ok';
  } else {
    if(i >= 0) buttons[i].classList.add('wrong');
    fb.textContent = i === -1 ? '⏱️ ¡Se acabó el tiempo!' : 'Respuesta incorrecta';
    fb.className = 'feedback-line no';
  }

  setTimeout(()=>{
    if(state.index < state.questions.length - 1){
      state.index++;
      state.answered = false;
      render();
    } else {
      recordPlay();
      state.screen = 'result';
      render();
    }
  }, 1100);
}

/* ---------- ESTADISTICAS (se guardan solo en este dispositivo) ---------- */
function recordPlay(){
  if(!Array.isArray(data.plays)) data.plays = [];
  data.plays.push({
    catId: state.category.id,
    catName: state.category.name,
    score: state.score,
    total: state.questions.length,
    win: state.score >= (data.winThreshold || 3),
    ts: Date.now()
  });
  if(data.plays.length > 500) data.plays = data.plays.slice(-500);
  persist();
}

function renderStatsSection(){
  const plays = Array.isArray(data.plays) ? data.plays : [];
  const totalPlays = plays.length;
  const wins = plays.filter(p=>p.win).length;
  const winRate = totalPlays ? Math.round((wins/totalPlays)*100) : 0;
  const avgScore = totalPlays ? (plays.reduce((s,p)=>s+p.score,0)/totalPlays).toFixed(1) : '0.0';

  const counts = {};
  plays.forEach(p=>{
    if(!counts[p.catId]) counts[p.catId] = { name: p.catName, count: 0, wins: 0 };
    counts[p.catId].count++;
    if(p.win) counts[p.catId].wins++;
  });
  const ranking = Object.values(counts).sort((a,b)=> b.count - a.count);
  const maxCount = ranking.length ? ranking[0].count : 1;

  const rankingHtml = ranking.length ? ranking.map(r=>{
    const pct = Math.round((r.count / maxCount) * 100);
    return `
      <div class="stat-bar-row">
        <span class="stat-bar-label">${escapeHtml(r.name)}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
        <span class="stat-bar-count">${r.count}</span>
      </div>`;
  }).join('') : `<div style="color:var(--muted);font-size:.85rem;">Todavía no se jugó ninguna partida en este dispositivo.</div>`;

  const lastPlay = totalPlays ? plays[plays.length - 1] : null;
  const lastPlayTxt = lastPlay ? new Date(lastPlay.ts).toLocaleString('es-AR') : '—';

  return `
    <div class="stats-card">
      <div class="stats-card-top">
        <strong style="font-size:1rem;">📊 Estadísticas de esta pantalla</strong>
        <button class="btn btn-ghost" style="font-size:.75rem;box-shadow:none;" onclick="resetStats()">🗑️ Reiniciar estadísticas</button>
      </div>
      <div class="stat-tiles">
        <div class="stat-tile"><div class="stat-num">${totalPlays}</div><div class="stat-label">Partidas jugadas</div></div>
        <div class="stat-tile"><div class="stat-num">${wins}</div><div class="stat-label">Ganadores 🏆</div></div>
        <div class="stat-tile"><div class="stat-num">${winRate}%</div><div class="stat-label">Tasa de victoria</div></div>
        <div class="stat-tile"><div class="stat-num">${avgScore}/5</div><div class="stat-label">Prom. de aciertos</div></div>
      </div>
      <div style="margin-top:16px;">
        <div style="font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;">Temáticas más jugadas</div>
        ${rankingHtml}
      </div>
      <div style="margin-top:12px;font-size:.72rem;color:var(--muted);">Última partida: ${lastPlayTxt} · Estos números se guardan solo en este dispositivo/navegador, no se comparten entre notebooks.</div>
    </div>
  `;
}

function resetStats(){
  if(!confirm('¿Reiniciar el contador de partidas y estadísticas de este dispositivo? No se van a borrar las preguntas cargadas.')) return;
  data.plays = [];
  persist();
  render();
  toast('Estadísticas reiniciadas');
}

/* ---------- RESULTADO ---------- */
function renderResult(){
  const total = state.questions.length;
  const win = state.score >= (data.winThreshold || 3);
  let html = `<div class="result-wrap">`;
  html += `<div class="result-emoji">${win?'🏆':'💪'}</div>`;
  html += `<div class="result-title ${win?'win':'lose'}">${win ? '¡GANASTE!' : '¡Casi! Seguí participando'}</div>`;
  html += `<div class="result-score">Respondiste correctamente ${state.score} de ${total} preguntas</div>`;
  if(win){
    html += `<div class="prize-box">🎁 ${escapeHtml(data.prizeMessage)}</div>`;
    setTimeout(()=> confettiBurst(), 50);
  } else {
    html += `<div class="lose-box">¡Buen intento! Podés volver a jugar las veces que quieras hasta ganar tu premio 💜</div>`;
  }
  html += `<div class="btn-row">
      <button class="btn btn-primary" onclick="playAgainSameCategory()">🔁 Jugar de nuevo</button>
      <button class="btn btn-secondary" onclick="backToHome()">🏠 Elegir otra temática</button>
    </div>`;
  html += `<div class="idle-note">Esta pantalla vuelve sola al inicio si nadie interactúa</div>`;
  html += `</div>`;
  return html;
}

function playAgainSameCategory(){ startGame(state.category); }
function backToHome(){
  clearInterval(state.timer); clearTimeout(state.timer);
  state.screen = 'home';
  state.category = null;
  render();
}

function confettiBurst(){
  const colors = ['#EF476F','#FFD60A','#06D6A0','#3A86FF','#FB5607','#7B2CBF'];
  for(let i=0;i<70;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100) + 'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    el.style.opacity = String(0.8 + Math.random()*0.2);
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 4200);
  }
}

function renderQuestionCard(catId, qq, idx){
  const letters = ['A','B','C'];
  const correctList = Array.isArray(qq.correct) ? qq.correct : [qq.correct];
  const opts = qq.options.map((opt,i)=>`
    <div class="opt-row">
      <input type="checkbox" ${correctList.includes(i)?'checked':''} onchange="toggleCorrect('${catId}',${idx},${i},this.checked)" title="Marcar como correcta">
      <span class="letter" style="width:26px;height:26px;border-radius:8px;background:#ece5fb;color:#5a189a;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.8rem;">${letters[i]}</span>
      <input type="text" value="${escapeAttr(opt)}" oninput="updateOption('${catId}',${idx},${i},this.value)">
    </div>`).join('');
  const multi = correctList.length >= 2;
  const hint = multi
    ? `<div style="margin-top:6px;font-size:.78rem;font-weight:700;color:#5a189a;background:#f3ecff;border-radius:10px;padding:8px 10px;">✨ Marcaste ${correctList.length} respuestas correctas: en el juego va a aparecer una 4ª opción "Todas son correctas (A, B, C o todas las anteriores)", y esa va a ser la única respuesta válida.</div>`
    : `<div style="margin-top:4px;font-size:.72rem;color:var(--muted);">Tip: marcá 2 o más respuestas como correctas para activar automáticamente la opción "Todas son correctas".</div>`;
  return `
    <div class="q-card">
      <div class="q-card-top">
        <strong style="font-size:.8rem;color:var(--muted);">Pregunta ${idx+1}</strong>
        <button class="small-del" onclick="deleteQuestion('${catId}',${idx})">🗑️ Eliminar</button>
      </div>
      <div class="field-row">
        <label>Texto de la pregunta</label>
        <input type="text" value="${escapeAttr(qq.q)}" oninput="updateQuestionText('${catId}',${idx},this.value)">
      </div>
      ${opts}
      ${hint}
    </div>`;
}

/* ---- mutadores de datos (no re-renderizan todo para no perder el foco al tipear) ---- */
function findCat(id){ return data.categories.find(c=>c.id===id); }

function updateCatField(id, field, value){
  const c = findCat(id); if(!c) return;
  c[field] = value; persist();
  if(field === 'name'){
    const tabs = document.querySelectorAll('.tab-btn');
  }
}
function updateCatEnabled(id, checked){
  const c = findCat(id); if(!c) return;
  c.enabled = checked; persist();
}
function deleteCategory(id){
  if(data.categories.length <= 1){ toast('Tiene que quedar al menos una temática'); return; }
  const c = findCat(id); if(!c) return;
  const n = c.questions.length;
  if(!confirm(`¿Eliminar la temática "${c.name}"${n>0 ? ` y su${n===1?'':'s'} ${n} pregunta${n===1?'':'s'}` : ''}? Esta acción no se puede deshacer.`)) return;
  data.categories = data.categories.filter(x=>x.id!==id);
  if(adminActiveTab === id) adminActiveTab = data.categories[0].id;
  persist();
  toast(`Temática "${c.name}" eliminada`);
  render();
}
function importQuestionsToCategory(catId, evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.questions) ? parsed.questions : null);
      if(!list) throw new Error('Formato inválido');
      const c = findCat(catId);
      if(!c) throw new Error('Temática no encontrada');
      let added = 0, skipped = 0;
      list.forEach(item=>{
        const validText = item && typeof item.q === 'string' && item.q.trim().length > 0;
        const validOpts = item && Array.isArray(item.options) && item.options.length === 3 && item.options.every(o=>typeof o === 'string' || typeof o === 'number');
        const validCorrect = item && (typeof item.correct === 'number' || (Array.isArray(item.correct) && item.correct.length > 0));
        if(!validText || !validOpts || !validCorrect){ skipped++; return; }
        c.questions.push(q(item.q, item.options.map(String), item.correct));
        added++;
      });
      if(added === 0){
        alert('El archivo no tenía preguntas con formato válido. Revisá el modelo JSON (cada pregunta necesita "q", "options" con 3 opciones y "correct").');
        return;
      }
      persist();
      render();
      toast(`${added} pregunta(s) agregada(s) a "${c.name}"${skipped>0 ? ` (se ignoraron ${skipped} con formato inválido)` : ''}`);
    }catch(e){
      alert('No se pudo leer el archivo. Verificá que sea un JSON válido con el formato del modelo.');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}
function addNewCategory(){
  const nameInput = document.getElementById('newCatName');
  const iconInput = document.getElementById('newCatIcon');
  const colorInput = document.getElementById('newCatColor');
  const name = (nameInput.value || '').trim();
  if(!name){ toast('Escribí un nombre para la nueva temática'); nameInput.focus(); return; }
  const icon = (iconInput.value || '').trim() || '✨';
  const color = colorInput.value || randomPaletteColor();
  const id = uniqueCatId(slugify(name));
  data.categories.push(cat(id, name, icon, color, []));
  persist();
  adminActiveTab = id;
  toast(`Temática "${name}" agregada. Ahora cargale las preguntas 👇`);
  render();
}
function updateQuestionText(catId, idx, value){
  const c = findCat(catId); if(!c) return;
  c.questions[idx].q = value; persist();
}
function updateOption(catId, idx, optIdx, value){
  const c = findCat(catId); if(!c) return;
  c.questions[idx].options[optIdx] = value; persist();
}
function toggleCorrect(catId, idx, optIdx, checked){
  const c = findCat(catId); if(!c) return;
  const qq = c.questions[idx];
  let arr = Array.isArray(qq.correct) ? qq.correct.slice() : [qq.correct];
  if(checked){
    if(!arr.includes(optIdx)) arr.push(optIdx);
    arr.sort((a,b)=>a-b);
    qq.correct = arr;
    persist();
  } else if(arr.length > 1){
    arr = arr.filter(i=>i!==optIdx);
    qq.correct = arr;
    persist();
  } else {
    // no se puede dejar una pregunta sin ninguna respuesta correcta
    toast('Tiene que haber al menos una respuesta correcta');
  }
  // se vuelve a pintar solo esta lista de preguntas para reflejar el aviso
  // de "todas correctas" (o revertir el checkbox) sin perder el resto del panel
  const list = document.getElementById(`qlist-${catId}`);
  if(list){ list.innerHTML = c.questions.map((q2,i2)=>renderQuestionCard(catId,q2,i2)).join(''); }
}
function addQuestion(catId){
  const c = findCat(catId); if(!c) return;
  c.questions.push(q('Escribí acá la nueva pregunta', ['Opción A', 'Opción B', 'Opción C'], 0));
  persist();
  document.getElementById(`qlist-${catId}`).innerHTML = c.questions.map((qq,i)=>renderQuestionCard(catId,qq,i)).join('');
  render(); // re-render completo para actualizar tabs / avisos
}
function deleteQuestion(catId, idx){
  const c = findCat(catId); if(!c) return;
  if(!confirm('¿Eliminar esta pregunta?')) return;
  c.questions.splice(idx,1); persist();
  render();
}

function resetDefaults(){
  if(!confirm('Esto va a reemplazar TODAS las preguntas cargadas por las preguntas de ejemplo originales. ¿Continuar?')) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  persist();
  adminActiveTab = data.categories[0].id;
  render();
  toast('Se restauraron las preguntas de ejemplo');
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trivia-ministerio-jujuy-datos.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Archivo de preguntas exportado');
}

function importJSON(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.categories)) throw new Error('Formato inválido');
      if(!confirm('Esto va a reemplazar todas las preguntas actuales en este dispositivo por las del archivo importado. ¿Continuar?')) return;
      data = parsed;
      persist();
      adminActiveTab = data.categories[0] ? data.categories[0].id : null;
      render();
      toast('Preguntas importadas correctamente');
    }catch(e){
      alert('No se pudo leer el archivo. Verificá que sea un JSON exportado desde este mismo juego.');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

/* ============================================================
   HELPERS DE ESCAPE
   ============================================================ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, s => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ============================================================
   INICIO
   ============================================================ */
render();
initRemoteSync(); // intenta traer el JSON publicado sin bloquear la pantalla inicial
